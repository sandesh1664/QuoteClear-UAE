services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quoteclear
      POSTGRES_USER: quoteclear
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quoteclear -d quoteclear"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://quoteclear:${POSTGRES_PASSWORD}@db:5432/quoteclear
      STORAGE_DIR: /data/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    environment: *backend_environment
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend_environment
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
